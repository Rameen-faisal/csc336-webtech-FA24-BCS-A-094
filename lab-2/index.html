
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 - Responsive Navbar and Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-md bg-light">
        <div class="container">

            <a class="navbar-brand" href="#">Shoply</a>

            <div class="navbar-right">
                <a href="#" class="cart-icon" aria-label="Shopping cart">🛒</a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarMenu"
                        aria-controls="navbarMenu"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <main class="container my-4">
        <div class="product-grid">

            <div class="product-card">
                <img src="https://placehold.co/400x300?text=Shirt" alt="Shirt">
                <h3>Shirt</h3>
                <p>Comfortable casual shirt for everyday wear.</p>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/400x300?text=Jeans" alt="Jeans">
                <h3>Jeans</h3>
                <p>Stylish denim jeans for everyday use.</p>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/400x300?text=Jacket" alt="Jacket">
                <h3>Jacket</h3>
                <p>Classic jacket for a casual look.</p>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/400x300?text=Shoes" alt="Shoes">
                <h3>Shoes</h3>
                <p>Comfortable shoes for daily wear.</p>
            </div>

        </div>
    </main>

</body>
</html>
